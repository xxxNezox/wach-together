<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wach Together — Tier List</title>
<style>
  :root {
    --item-w: 96px;
    --label-w: 52px;
    --bg: #121419;
    --panel: #1d2028;
    --panel-2: #262a35;
    --text: #e7e9ee;
    --muted: #8b93a1;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    padding-bottom: 48px;
  }
  .app { max-width: 860px; margin: 0 auto; }

  header {
    padding: 16px 16px 10px;
    position: sticky;
    top: 0;
    z-index: 20;
    background: linear-gradient(var(--bg) 80%, rgba(18,20,25,0));
  }
  header h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }

  #pool { padding: 12px 16px 4px; }
  .section-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title .count {
    background: var(--panel-2);
    border-radius: 99px;
    padding: 2px 9px;
    font-size: 11px;
    letter-spacing: 0;
  }
  .pool-items {
    display: flex;
    flex-wrap: nowrap;
    gap: 10px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    min-height: 48px;
    border: 1px dashed #333946;
    border-radius: 14px;
    padding: 12px;
  }

  .tiers {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 8px 16px;
  }
  .tier {
    display: flex;
    border-radius: 12px;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid #262a35;
    min-height: 168px;
    cursor: pointer;
  }
  .tier-label {
    flex: 0 0 var(--label-w);
    width: var(--label-w);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-weight: 800;
    color: #14151a;
    font-size: 26px;
    letter-spacing: .5px;
  }
  .tier-label span {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    opacity: .65;
    text-align: center;
    padding: 0 4px;
  }
  .tier-items {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 8px;
    padding: 8px;
    min-height: 100%;
  }

  .item {
    width: var(--item-w);
    flex: 0 0 var(--item-w);
    border-radius: 10px;
    overflow: hidden;
    background: #2b2f3a;
    border: 2px solid transparent;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    transition: border-color .12s, box-shadow .12s, opacity .12s;
    touch-action: manipulation;
  }
  .item img {
    display: block;
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    background: #20232c;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .item .name { padding: 6px 7px 8px; }
  .item .ru {
    font-size: 11px;
    font-weight: 600;
    line-height: 1.25;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .item .en {
    font-size: 9.5px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: block;
  }
  .item.selected {
    border-color: #fff;
    box-shadow: 0 0 0 3px rgba(255,255,255,.28), 0 6px 18px rgba(0,0,0,.4);
  }
  .item.dragging { opacity: .35; }

  .drag-ghost {
    position: fixed;
    z-index: 9999;
    pointer-events: none;
    box-shadow: 0 14px 34px rgba(0,0,0,.55);
    transform: rotate(3deg) scale(1.06);
    transform-origin: center;
  }

  details.legend {
    padding: 4px 16px 12px;
    color: var(--muted);
    font-size: 12px;
  }
  details.legend summary { cursor: pointer; color: var(--text); font-size: 13px; }
  details.legend ul { margin: 8px 0 0; padding-left: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 16px; }

  @media (min-width: 640px) {
    :root { --item-w: 104px; --label-w: 64px; }
    header h1 { font-size: 24px; }
    .item .ru { font-size: 12px; }
    .item .en { font-size: 10px; }
    .tier-label { font-size: 30px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>просмотровый рейтинг</h1>
  </header>

  <section id="pool">
    <div class="section-title">Не распределены <span class="count" id="pool-count">0</span></div>
    <div class="pool-items" id="pool-items"></div>
  </section>

  <div class="tiers" id="tiers"></div>

  <details class="legend">
    <summary>Значения оценок</summary>
    <ul id="legend-list"></ul>
  </details>
</div>

<script>
const TIERS = ["S", "A", "B", "C", "D", "E", "F"];
const TIER_COLORS = {
  S: "#ff6b6b",
  A: "#ffa94d",
  B: "#ffd43b",
  C: "#8ce99a",
  D: "#63e6be",
  E: "#74c0fc",
  F: "#b197fc"
};
const TIER_MEANINGS = {
  S: "Супер",
  A: "Отлично",
  B: "Хорошо",
  C: "Удовлетворительно",
  D: "Неудовлетворительно",
  E: "Крайне плохо",
  F: "Полный провал"
};
const STORAGE_KEY = "wach-together-tierlist-v1";

const poolItems = document.getElementById("pool-items");
const tiersEl = document.getElementById("tiers");
const poolCountEl = document.getElementById("pool-count");

let movies = [];
let items = {};
let tierContainers = {};
let selectedId = null;
let drag = null;

const esc = (s) => String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function buildTiers() {
  const legend = document.getElementById("legend-list");
  TIERS.forEach((t) => {
    const row = document.createElement("div");
    row.className = "tier";
    row.dataset.tier = t;

    const label = document.createElement("div");
    label.className = "tier-label";
    label.style.background = TIER_COLORS[t];
    label.innerHTML = t + "<span>" + TIER_MEANINGS[t] + "</span>";

    const box = document.createElement("div");
    box.className = "tier-items";
    box.dataset.tier = t;

    row.appendChild(label);
    row.appendChild(box);
    tiersEl.appendChild(row);
    tierContainers[t] = box;

    const li = document.createElement("li");
    li.innerHTML = "<b>" + t + "</b> — " + TIER_MEANINGS[t];
    legend.appendChild(li);
  });
}

function buildItem(m) {
  const id = m.title_en;
  const el = document.createElement("div");
  el.className = "item";
  el.dataset.id = id;
  el.draggable = false;
  el.title = m.title_en;

  const img = document.createElement("img");
  img.src = m.cover;
  img.alt = m.title_ru;
  img.loading = "lazy";
  img.decoding = "async";

  const name = document.createElement("div");
  name.className = "name";
  name.innerHTML = '<div class="ru">' + esc(m.title_ru) + '</div><span class="en">' + esc(m.title_en) + "</span>";

  el.appendChild(img);
  el.appendChild(name);
  return el;
}

function renderPool() {
  movies.forEach((m) => {
    const el = buildItem(m);
    items[m.title_en] = el;
    poolItems.appendChild(el);
  });
}

function idsOf(container) {
  return Array.from(container.querySelectorAll(":scope > .item")).map((el) => el.dataset.id);
}

function save() {
  const state = { pool: idsOf(poolItems) };
  TIERS.forEach((t) => (state[t] = idsOf(tierContainers[t])));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function load() {
  let state = null;
  try { state = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) {}
  if (!state) return;
  (state.pool || []).forEach((id) => items[id] && poolItems.appendChild(items[id]));
  TIERS.forEach((t) => (state[t] || []).forEach((id) => items[id] && tierContainers[t].appendChild(items[id])));
}

function updateCount() {
  const n = idsOf(poolItems).length;
  poolCountEl.textContent = n;
}

function setSelected(id) {
  selectedId = id;
  Object.values(items).forEach((el) => el.classList.remove("selected"));
  if (id) items[id].classList.add("selected");
}

function placeSelected(container) {
  if (!selectedId) return;
  container.appendChild(items[selectedId]);
  setSelected(null);
  save();
  updateCount();
}

function handleItemTap(id) {
  if (selectedId === id) setSelected(null);
  else setSelected(id);
}

function getTargetContainer(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el) return null;
  const tier = el.closest(".tier");
  if (tier) return tier.querySelector(".tier-items");
  if (el.closest("#pool")) return poolItems;
  return null;
}

function getInsertIndex(container, x, y, draggedEl) {
  const kids = Array.from(container.children).filter((c) => c !== draggedEl);
  let idx = kids.length;
  for (let i = 0; i < kids.length; i++) {
    const r = kids[i].getBoundingClientRect();
    if (y < r.top + r.height / 2 && x < r.left + r.width / 2) {
      idx = i;
      break;
    }
  }
  return idx;
}

function startDrag(e) {
  const rect = drag.el.getBoundingClientRect();
  const ghost = drag.el.cloneNode(true);
  ghost.classList.add("drag-ghost");
  ghost.style.width = rect.width + "px";
  ghost.style.left = rect.left + "px";
  ghost.style.top = rect.top + "px";
  document.body.appendChild(ghost);
  drag.ghost = ghost;
  drag.offsetX = e.clientX - rect.left;
  drag.offsetY = e.clientY - rect.top;
  drag.active = true;
  drag.el.classList.add("dragging");
  setSelected(null);
}

function onPointerMove(e) {
  if (!drag) return;
  if (!drag.moved) {
    if (Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) > 6) {
      drag.moved = true;
      if (e.pointerType !== "touch") startDrag(e);
    } else {
      return;
    }
  }
  if (!drag.active) return;

  drag.ghost.style.left = e.clientX - drag.offsetX + "px";
  drag.ghost.style.top = e.clientY - drag.offsetY + "px";

  const target = getTargetContainer(e.clientX, e.clientY);
  if (target) {
    const idx = getInsertIndex(target, e.clientX, e.clientY, drag.el);
    const before = target.children[idx] || null;
    if (before !== drag.el && target.children[idx] !== drag.el) {
      target.insertBefore(drag.el, before);
    }
  }

  const margin = 60;
  if (e.clientY < margin) window.scrollBy(0, -14);
  else if (e.clientY > window.innerHeight - margin) window.scrollBy(0, 14);
}

function onPointerUp(e) {
  if (!drag) return;
  const wasTap = !drag.moved;
  if (drag.active) {
    drag.el.classList.remove("dragging");
    if (drag.ghost) drag.ghost.remove();
    save();
    updateCount();
  } else if (wasTap) {
    handleItemTap(drag.el.dataset.id);
  }
  drag = null;
}

function onPointerCancel() {
  if (drag && drag.active) {
    drag.el.classList.remove("dragging");
    if (drag.ghost) drag.ghost.remove();
  }
  drag = null;
}

document.addEventListener("pointerdown", (e) => {
  const item = e.target.closest(".item");
  if (!item) return;
  if (e.pointerType === "mouse" && e.button !== 0) return;
  drag = {
    id: item.dataset.id,
    el: item,
    startX: e.clientX,
    startY: e.clientY,
    moved: false,
    active: false,
    ghost: null,
    offsetX: 0,
    offsetY: 0
  };
});
document.addEventListener("pointermove", onPointerMove);
document.addEventListener("pointerup", onPointerUp);
document.addEventListener("pointercancel", onPointerCancel);

document.addEventListener("click", (e) => {
  if (e.target.closest(".item")) return;
  const tier = e.target.closest(".tier");
  if (tier) {
    placeSelected(tier.querySelector(".tier-items"));
  } else if (e.target.closest("#pool")) {
    placeSelected(poolItems);
  }
});





fetch("movies.json")
  .then((r) => r.json())
  .then((data) => {
    movies = data;
    buildTiers();
    renderPool();
    load();
    updateCount();
  });
</script>
</body>
</html>
