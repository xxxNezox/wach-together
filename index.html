<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wach Together — Tier List</title>
<style>
  :root {
    --item-w: 96px;
    --label-w: 52px;
    --bg: #121419;
    --panel: #1d2028;
    --panel-2: #262a35;
    --text: #e7e9ee;
    --muted: #8b93a1;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    padding-bottom: 48px;
  }
  .app { max-width: 860px; margin: 0 auto; }

  header {
    padding: 16px 16px 10px;
    position: sticky;
    top: 0;
    z-index: 20;
    background: linear-gradient(var(--bg) 80%, rgba(18,20,25,0));
  }
  header h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  button {
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid #333946;
    border-radius: 10px;
    padding: 9px 14px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .5; cursor: default; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(16px);
    background: #262a35;
    color: var(--text);
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid #333946;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 10000;
    max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #pool { padding: 12px 16px 4px; }
  .section-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title .count {
    background: var(--panel-2);
    border-radius: 99px;
    padding: 2px 9px;
    font-size: 11px;
    letter-spacing: 0;
  }
  .pool-items {
    display: flex;
    flex-wrap: nowrap;
    gap: 10px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    min-height: 48px;
    border: 1px dashed #333946;
    border-radius: 14px;
    padding: 12px;
  }

  .tiers {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 8px 16px;
  }
  .tier {
    display: flex;
    border-radius: 12px;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid #262a35;
    min-height: 168px;
    cursor: pointer;
  }
  .tier-label {
    flex: 0 0 var(--label-w);
    width: var(--label-w);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-weight: 800;
    color: #14151a;
    font-size: 26px;
    letter-spacing: .5px;
  }
  .tier-items {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 8px;
    padding: 8px;
    min-height: 100%;
  }

  .item {
    width: var(--item-w);
    flex: 0 0 var(--item-w);
    border-radius: 10px;
    overflow: hidden;
    background: #2b2f3a;
    border: 2px solid transparent;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    transition: border-color .12s, box-shadow .12s, opacity .12s;
    touch-action: manipulation;
  }
  .tier .item { touch-action: none; }
  .item img {
    display: block;
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    background: #20232c;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .item .name { padding: 6px 7px 8px; }
  .item .ru {
    font-size: 11px;
    font-weight: 600;
    line-height: 1.25;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .item .en {
    font-size: 9.5px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: block;
  }
  .item.selected {
    border-color: #fff;
    box-shadow: 0 0 0 3px rgba(255,255,255,.28), 0 6px 18px rgba(0,0,0,.4);
  }
  .item.dragging { opacity: .35; }

  .drag-ghost {
    position: fixed;
    z-index: 9999;
    pointer-events: none;
    box-shadow: 0 14px 34px rgba(0,0,0,.55);
    transform: rotate(3deg) scale(1.06);
    transform-origin: center;
  }

  details.legend {
    padding: 4px 16px 12px;
    color: var(--muted);
    font-size: 12px;
  }
  details.legend summary { cursor: pointer; color: var(--text); font-size: 13px; }
  details.legend ul { margin: 8px 0 0; padding-left: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 16px; }

  @media (min-width: 640px) {
    :root { --item-w: 104px; --label-w: 64px; }
    header h1 { font-size: 24px; }
    .item .ru { font-size: 12px; }
    .item .en { font-size: 10px; }
    .tier-label { font-size: 30px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-row">
      <h1>просмотровый рейтинг</h1>
      <button id="share">Поделиться</button>
    </div>
  </header>

  <section id="pool">
    <div class="section-title">Не распределены <span class="count" id="pool-count">0</span></div>
    <div class="pool-items" id="pool-items"></div>
  </section>

  <div class="tiers" id="tiers"></div>

  <details class="legend">
    <summary>Значения оценок</summary>
    <ul id="legend-list"></ul>
  </details>
</div>

<div class="toast" id="toast"></div>

<script>
const TIERS = ["S", "A", "B", "C", "D", "E", "F"];
const TIER_COLORS = {
  S: "#ff6b6b",
  A: "#ffa94d",
  B: "#ffd43b",
  C: "#8ce99a",
  D: "#63e6be",
  E: "#74c0fc",
  F: "#b197fc"
};
const TIER_MEANINGS = {
  S: "Супер",
  A: "Отлично",
  B: "Хорошо",
  C: "Удовлетворительно",
  D: "Неудовлетворительно",
  E: "Крайне плохо",
  F: "Полный провал"
};
const STORAGE_KEY = "wach-together-tierlist-v1";

const poolItems = document.getElementById("pool-items");
const tiersEl = document.getElementById("tiers");
const poolCountEl = document.getElementById("pool-count");

let movies = [];
let items = {};
let tierContainers = {};
let selectedId = null;
let drag = null;

const esc = (s) => String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function buildTiers() {
  const legend = document.getElementById("legend-list");
  TIERS.forEach((t) => {
    const row = document.createElement("div");
    row.className = "tier";
    row.dataset.tier = t;

    const label = document.createElement("div");
    label.className = "tier-label";
    label.style.background = TIER_COLORS[t];
    label.textContent = t;

    const box = document.createElement("div");
    box.className = "tier-items";
    box.dataset.tier = t;

    row.appendChild(label);
    row.appendChild(box);
    tiersEl.appendChild(row);
    tierContainers[t] = box;

    const li = document.createElement("li");
    li.innerHTML = "<b>" + t + "</b> — " + TIER_MEANINGS[t];
    legend.appendChild(li);
  });
}

function buildItem(m) {
  const id = m.title_en;
  const el = document.createElement("div");
  el.className = "item";
  el.dataset.id = id;
  el.draggable = false;
  el.title = m.title_en;

  const img = document.createElement("img");
  img.src = m.cover;
  img.alt = m.title_ru;
  img.loading = "lazy";
  img.decoding = "async";

  const name = document.createElement("div");
  name.className = "name";
  name.innerHTML = '<div class="ru">' + esc(m.title_ru) + '</div><span class="en">' + esc(m.title_en) + "</span>";

  el.appendChild(img);
  el.appendChild(name);
  return el;
}

function renderPool() {
  movies.forEach((m) => {
    const el = buildItem(m);
    items[m.title_en] = el;
    poolItems.appendChild(el);
  });
}

function idsOf(container) {
  return Array.from(container.querySelectorAll(":scope > .item")).map((el) => el.dataset.id);
}

function save() {
  const state = { pool: idsOf(poolItems) };
  TIERS.forEach((t) => (state[t] = idsOf(tierContainers[t])));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function load() {
  let state = null;
  try { state = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) {}
  if (!state) return;
  (state.pool || []).forEach((id) => items[id] && poolItems.appendChild(items[id]));
  TIERS.forEach((t) => (state[t] || []).forEach((id) => items[id] && tierContainers[t].appendChild(items[id])));
}

function updateCount() {
  const n = idsOf(poolItems).length;
  poolCountEl.textContent = n;
}

function setSelected(id) {
  selectedId = id;
  Object.values(items).forEach((el) => el.classList.remove("selected"));
  if (id) items[id].classList.add("selected");
}

function placeSelected(container) {
  if (!selectedId) return;
  container.appendChild(items[selectedId]);
  setSelected(null);
  save();
  updateCount();
}

function handleItemTap(id) {
  if (selectedId === id) setSelected(null);
  else setSelected(id);
}

function getTargetContainer(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el) return null;
  const tier = el.closest(".tier");
  if (tier) return tier.querySelector(".tier-items");
  if (el.closest("#pool")) return poolItems;
  return null;
}

function getInsertIndex(container, x, y, draggedEl) {
  const kids = Array.from(container.children).filter((c) => c !== draggedEl);
  let idx = kids.length;
  for (let i = 0; i < kids.length; i++) {
    const r = kids[i].getBoundingClientRect();
    if (y < r.top + r.height / 2 && x < r.left + r.width / 2) {
      idx = i;
      break;
    }
  }
  return idx;
}

function startDrag(e) {
  const rect = drag.el.getBoundingClientRect();
  const ghost = drag.el.cloneNode(true);
  ghost.classList.add("drag-ghost");
  ghost.style.width = rect.width + "px";
  ghost.style.left = rect.left + "px";
  ghost.style.top = rect.top + "px";
  document.body.appendChild(ghost);
  drag.ghost = ghost;
  drag.offsetX = e.clientX - rect.left;
  drag.offsetY = e.clientY - rect.top;
  drag.active = true;
  drag.el.classList.add("dragging");
  setSelected(null);
}

function onPointerMove(e) {
  if (!drag) return;
  if (!drag.moved) {
    if (Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) > 6) {
      drag.moved = true;
      if (e.pointerType !== "touch" || !drag.el.closest("#pool-items")) startDrag(e);
    } else {
      return;
    }
  }
  if (!drag.active) return;

  drag.ghost.style.left = e.clientX - drag.offsetX + "px";
  drag.ghost.style.top = e.clientY - drag.offsetY + "px";

  const target = getTargetContainer(e.clientX, e.clientY);
  if (target) {
    const idx = getInsertIndex(target, e.clientX, e.clientY, drag.el);
    const before = target.children[idx] || null;
    if (before !== drag.el && target.children[idx] !== drag.el) {
      target.insertBefore(drag.el, before);
    }
  }

  const margin = 60;
  if (e.clientY < margin) window.scrollBy(0, -14);
  else if (e.clientY > window.innerHeight - margin) window.scrollBy(0, 14);
}

function onPointerUp(e) {
  if (!drag) return;
  const wasTap = !drag.moved;
  if (drag.active) {
    drag.el.classList.remove("dragging");
    if (drag.ghost) drag.ghost.remove();
    save();
    updateCount();
  } else if (wasTap) {
    handleItemTap(drag.el.dataset.id);
  }
  drag = null;
}

function onPointerCancel() {
  if (drag && drag.active) {
    drag.el.classList.remove("dragging");
    if (drag.ghost) drag.ghost.remove();
  }
  drag = null;
}

document.addEventListener("pointerdown", (e) => {
  const item = e.target.closest(".item");
  if (!item) return;
  if (e.pointerType === "mouse" && e.button !== 0) return;
  drag = {
    id: item.dataset.id,
    el: item,
    startX: e.clientX,
    startY: e.clientY,
    moved: false,
    active: false,
    ghost: null,
    offsetX: 0,
    offsetY: 0
  };
});
document.addEventListener("pointermove", onPointerMove);
document.addEventListener("pointerup", onPointerUp);
document.addEventListener("pointercancel", onPointerCancel);

document.addEventListener("click", (e) => {
  if (e.target.closest(".item")) return;
  const tier = e.target.closest(".tier");
  if (tier) {
    placeSelected(tier.querySelector(".tier-items"));
  } else if (e.target.closest("#pool")) {
    placeSelected(poolItems);
  }
});





let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

const coverCache = {};
function loadImage(src) {
  if (coverCache[src]) return coverCache[src];
  coverCache[src] = new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve({ ok: true, img });
    img.onerror = () => resolve({ ok: false, img: null });
    img.src = src;
  });
  return coverCache[src];
}

function roundedRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function truncate(ctx, text, maxWidth) {
  if (ctx.measureText(text).width <= maxWidth) return text;
  let t = text;
  while (t.length && ctx.measureText(t + "…").width > maxWidth) t = t.slice(0, -1);
  return t + "…";
}

function wrapText(ctx, text, maxWidth, maxLines) {
  const words = text.split(" ");
  const lines = [];
  let cur = "";
  for (const w of words) {
    const cand = cur ? cur + " " + w : w;
    if (ctx.measureText(cand).width <= maxWidth) cur = cand;
    else { if (cur) lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines) {
    lines.splice(maxLines - 1);
    lines[maxLines - 1] = truncate(ctx, lines[maxLines - 1], maxWidth);
  }
  return lines;
}

async function renderTierImage() {
  const loaded = {};
  await Promise.all(movies.map(async (m) => { loaded[m.title_en] = (await loadImage(m.cover)).img; }));

  const canvasW = 1080;
  const padX = 28;
  const padY = 28;
  const labelW = 130;
  const gap = 12;
  const posterW = 96;
  const posterH = 144;
  const titleH = 38;
  const itemH = posterH + titleH;
  const availW = canvasW - padX * 2 - labelW - gap;
  const perLine = Math.max(1, Math.floor((availW + gap) / (posterW + gap)));

  const sections = TIERS.map((t) => ({ label: t, color: TIER_COLORS[t], ids: idsOf(tierContainers[t]) }));
  const unplaced = idsOf(poolItems);
  if (unplaced.length) sections.push({ label: "", color: "#3a3f4b", ids: unplaced });

  let height = padY;
  sections.forEach((s) => {
    const rows = s.ids.length ? Math.ceil(s.ids.length / perLine) : 1;
    height += rows * itemH + gap * 2;
  });
  height += padY;

  const canvas = document.createElement("canvas");
  canvas.width = canvasW;
  canvas.height = Math.max(height, 200);
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#121419";
  ctx.fillRect(0, 0, canvasW, canvas.height);

  let y = padY;
  sections.forEach((s) => {
    const rows = s.ids.length ? Math.ceil(s.ids.length / perLine) : 1;
    const bandH = rows * itemH + gap * 2;

    ctx.fillStyle = "#1d2028";
    roundedRect(ctx, padX, y, canvasW - padX * 2, bandH, 18);
    ctx.fill();

    ctx.fillStyle = s.color;
    roundedRect(ctx, padX + 10, y + 10, labelW - 10, bandH - 20, 14);
    ctx.fill();

    ctx.fillStyle = "#14151a";
    ctx.font = "800 64px -apple-system, 'Segoe UI', Roboto, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(s.label, padX + 10 + (labelW - 10) / 2, y + bandH / 2);

    const startX = padX + labelW + gap;
    s.ids.forEach((id, i) => {
      const col = i % perLine;
      const row = Math.floor(i / perLine);
      const ix = startX + col * (posterW + gap);
      const iy = y + 10 + row * itemH;
      const img = loaded[id];
      if (img) {
        ctx.save();
        roundedRect(ctx, ix, iy, posterW, posterH, 12);
        ctx.clip();
        ctx.drawImage(img, ix, iy, posterW, posterH);
        ctx.restore();
      } else {
        ctx.fillStyle = "#20232c";
        roundedRect(ctx, ix, iy, posterW, posterH, 12);
        ctx.fill();
      }
      const m = movies.find((mm) => mm.title_en === id);
      ctx.fillStyle = "#e7e9ee";
      ctx.font = "600 15px -apple-system, 'Segoe UI', Roboto, sans-serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      wrapText(ctx, m.title_ru, posterW, 2).forEach((ln, li) => {
        ctx.fillText(ln, ix, iy + posterH + 4 + li * 18);
      });
    });

    y += bandH;
  });

  return canvas;
}

function downloadBlob(blob) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "tierlist.png";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("Изображение сохранено");
}

async function onShare() {
  const btn = document.getElementById("share");
  btn.disabled = true;
  let blob;
  try {
    const canvas = await renderTierImage();
    blob = await new Promise((r) => canvas.toBlob(r, "image/png"));
  } catch (e) {
    toast("Не удалось сформировать изображение");
    btn.disabled = false;
    return;
  }
  const file = new File([blob], "tierlist.png", { type: "image/png" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: "Мой просмотровый рейтинг" });
      btn.disabled = false;
      return;
    } catch (e) {
      if (e && e.name === "AbortError") { btn.disabled = false; return; }
    }
  }
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
      toast("Изображение скопировано в буфер");
    } else {
      downloadBlob(blob);
    }
  } catch (e) {
    downloadBlob(blob);
  }
  btn.disabled = false;
}

document.getElementById("share").addEventListener("click", onShare);

fetch("movies.json")
  .then((r) => r.json())
  .then((data) => {
    movies = data;
    buildTiers();
    renderPool();
    load();
    updateCount();
  });
</script>
</body>
</html>
